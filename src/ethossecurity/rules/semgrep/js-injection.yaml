      - pattern: Number.parseInt(...)
      - pattern: Number.parseFloat(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Boolean(...)
      - pattern: Math.$FN(...)
      - pattern: $X.length
      - pattern: $TAG`...`
      - pattern: |
          {..., text: $SQLTEXT, ..., values: $VALUES, ...}
      - pattern: |
          {..., sql: $SQLTEXT, ..., values: $VALUES, ...}
      - pattern: |
          {..., sql: $SQLTEXT, ..., args: $VALUES, ...}
      - pattern: $ARR.map(() => $BODY)
      - patterns:
          - pattern-either:
              - pattern: $ARR.map(($ITEM) => $BODY)
              - pattern: $ARR.map(($ITEM, $IDX) => $BODY)
          - pattern-not: $ARR.map(($ITEM, ...) => <... $ITEM ...>)
      # escape helpers, mysql format(), pg-format %L/%I
      - pattern-either: *sql-escape-sanitizers
      # Allowlist checks: ALLOWED.includes(x) ? x : "id", keys.filter((k) => ALLOWED.has(k))
      - pattern: "$LIST.includes(...) ? $A : $B"
      - pattern: "$LIST.has(...) ? $A : $B"
      - pattern: $ARR.filter(($K) => $LIST.includes($K))
      - pattern: $ARR.filter(($K) => $LIST.has($K))
      - by-side-effect: true
        patterns:
          - pattern: $RE.test($X)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $LIST.includes($X)
              - pattern: $LIST.has($X)
          - focus-metavariable: $X
