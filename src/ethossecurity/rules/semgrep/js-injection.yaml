  - id: ethos.js.command-injection-from-request
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      HTTP request data is passed to a shell command (child_process exec/execSync, promisified
      exec, or spawn/execFile/execa with shell enabled), allowing OS command injection. Use
      execFile/spawn with a fixed program and an argument array, keep the shell disabled, and
      validate each argument against an allowlist.
    metadata:
      cwe: ["CWE-78"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
    mode: taint
    pattern-sources: *request-sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: Number.parseInt(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: "$LIST.includes(...) ? $A : $B"
      - pattern: "$LIST.has(...) ? $A : $B"
      - pattern: $X.length
      # shell-quote quote(), shell-escape, escapeShellArg() and similar helpers
      - patterns:
          - pattern: $ESCAPE(...)
          - metavariable-regex:
              metavariable: $ESCAPE
              regex: (?i)^(.+\.)?\w*(quote|escape)\w*$
      - patterns:
          - pattern: $STR.replace($RE, ...)
          - metavariable-regex:
              metavariable: $RE
              regex: ^/\[\^
      - by-side-effect: true
        patterns:
          - pattern: $RE.test($X)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $LIST.includes($X)
              - pattern: $LIST.has($X)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either: *command-sinks
          - focus-metavariable: $CMD

