      - pattern: parseInt(...)
      - pattern: $X.length
      - patterns:
          - pattern: $ESCAPE(...)
          - metavariable-regex:
              metavariable: $ESCAPE
              regex: (?i)^(.+\.)?\w*(quote|escape)\w*$
      - patterns:
          - pattern: $STR.replace($RE, ...)
          - metavariable-regex:
              metavariable: $RE
              regex: ^/\[\^
      - by-side-effect: true
