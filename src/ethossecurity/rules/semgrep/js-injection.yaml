          - pattern-either: *sql-sinks
          - focus-metavariable: $Q

  # ===========================================================================
  # NoSQL (MongoDB / Mongoose) injection
  # ===========================================================================
  - id: ethos.js.nosql-injection-request-object
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A whole request object (req.body, req.query or parsed JSON) is used as a MongoDB/Mongoose
      query filter, so an attacker can inject operators such as {"$ne": null} or {"$gt": ""} to
      bypass checks or read and delete other records. Build the filter from individual fields that
      are converted to plain strings/numbers, or enable Mongoose sanitizeFilter.
    metadata:
      cwe: ["CWE-943"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.query
          - pattern-not-inside: $REQ.$FIELD.$SUB
          - pattern-not-inside: $REQ.$FIELD[$KEY]
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(.+\.)?(req|request)$
      - patterns:
          - pattern: $REQ.json()
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(.+\.)?(req|request)$
      # const { page, ...filters } = req.query (taint does not flow through rest elements)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const {..., ...$REST} = $REQ.$OBJ;
                  ...
              - pattern-inside: |
                  let {..., ...$REST} = $REQ.$OBJ;
                  ...
          - pattern: $REST
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(.+\.)?(req|request)$
          - metavariable-regex:
              metavariable: $OBJ
              regex: ^(body|query)$
      - patterns:
          - pattern-either:
              - pattern: JSON.parse($REQ.query.$FIELD)
              - pattern: JSON.parse($REQ.body.$FIELD)
              - pattern: JSON.parse($REQ.query[$KEY])
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(.+\.)?(req|request)$
    pattern-sanitizers:
      - pattern: mongoSanitize.sanitize(...)
      - pattern: sanitizeFilter(...)
      - pattern: $MONGOOSE.sanitizeFilter(...)
      - pattern: String(...)
      # Schema validation (zod, Joi, yup, valibot) returns a typed object, not raw operators.
      - patterns:
          - pattern-either:
              - pattern: $SCHEMA.parse(...)
              - pattern: $SCHEMA.safeParse(...)
              - pattern: $SCHEMA.parseAsync(...)
              - pattern: $SCHEMA.safeParseAsync(...)
              - pattern: $SCHEMA.validate(...)
              - pattern: $SCHEMA.validateAsync(...)
              - pattern: $SCHEMA.validateSync(...)
          - metavariable-regex:
              metavariable: $SCHEMA
              regex: ^(?!(JSON|qs|querystring|QueryString|url|URL|path|Date|bodyParser|cookie|cookieParser)$)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $MODEL.$FIND($FILTER, ...)
              - pattern: |
                  $MODEL.$FIND({..., ...$FILTER, ...}, ...)
          - metavariable-regex:
              metavariable: $FIND
              regex: ^(find|findOne|findOneAndUpdate|findOneAndDelete|findOneAndReplace|findOneAndRemove|updateOne|updateMany|deleteOne|deleteMany|replaceOne|countDocuments)$
          # The filter itself must be the request object (not a field such as user.id).
          - metavariable-regex:
              metavariable: $FILTER
              regex: (?s)^(await\s+)?([A-Za-z_$][\w$]*|(.+\.)?(req|request)\.(body|query)|JSON\.parse\(.*\)|(.+\.)?(req|request)\.json\(\))$
          - focus-metavariable: $FILTER
      - patterns:
          - pattern: |
              $MODEL.aggregate([..., {$match: $FILTER}, ...], ...)
          - focus-metavariable: $FILTER

  # ===========================================================================
  # Path traversal
  # ===========================================================================
  - id: ethos.js.path-traversal-from-request
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      HTTP request data is used to build a filesystem path (fs read/write/delete, res.sendFile,
      res.download), so "../" sequences or absolute paths can reach files outside the intended
      folder. Reduce the input to a file name with path.basename(), resolve it against a fixed base
      directory and reject results that do not start with that directory (or pass { root } to
      res.sendFile).
    metadata:
      cwe: ["CWE-22"]
      owasp: ["A01:2021 - Broken Access Control"]
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
    mode: taint
    pattern-sources: *request-sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: $X.length
      - pattern: $PATH.basename(...)
      - pattern: basename(...)
      - pattern: sanitize(...)
      - pattern: sanitizeFilename(...)
      - pattern: "$LIST.includes(...) ? $A : $B"
      - pattern: "$LIST.has(...) ? $A : $B"
      - patterns:
          - pattern: $STR.replace($RE, ...)
          - metavariable-regex:
              metavariable: $RE
              regex: ^/\[\^
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $X.startsWith(...)
              - pattern: $X.includes("..")
              - pattern: $X.indexOf("..")
              - pattern: $RE.test($X)
              - pattern: $LIST.includes($X)
              - pattern: $LIST.has($X)
              - pattern: $PATH.relative($ROOT, $X)
              # realpath() is used to compare the canonical path against the base directory
              - pattern: $FS.realpathSync($X, ...)
              - pattern: $FS.realpath($X, ...)
              - pattern: realpathSync($X, ...)
              - pattern: realpath($X, ...)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: $VALIDATE($X)
          - metavariable-regex:
              metavariable: $VALIDATE
              regex: (?i)^(.+\.)?\w*(allow|valid|safe|trust|permit|whitelist)\w*$
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern: $FS.$FSFN($P, ...)
                          - metavariable-regex:
                              metavariable: $FSFN
                              regex: ^(readFile|readFileSync|createReadStream|createWriteStream|writeFile|writeFileSync|appendFile|appendFileSync|unlink|unlinkSync|rm|rmSync|rmdir|rmdirSync|readdir|readdirSync|open|openSync|readJson|readJSON|readJsonSync|writeJson|writeJSON|outputFile|outputJson|remove|removeSync|copyFile|copyFileSync|rename|renameSync)$
                      - patterns:
                          - pattern: $FS.$FSFN2($FROM, $P, ...)
                          - metavariable-regex:
                              metavariable: $FSFN2
                              regex: ^(copyFile|copyFileSync|rename|renameSync|copy|move|cp|cpSync)$
                  - metavariable-regex:
                      metavariable: $FS
                      regex: ^(fs|fsp|fsPromises|fs\.promises|promises|fse|fsExtra|fsx|fsSync|nodeFs|fsAsync)$
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $FSMOD = require('fs');
                          ...
                      - pattern-inside: |
                          $FSMOD = require('node:fs');
                          ...
                      - pattern-inside: |
                          $FSMOD = require('fs/promises');
                          ...
                      - pattern-inside: |
                          $FSMOD = require('node:fs/promises');
                          ...
                      - pattern-inside: |
                          import { $FSFN } from 'fs';
                          ...
                      - pattern-inside: |
                          import { $FSFN } from 'node:fs';
                          ...
                      - pattern-inside: |
                          import { $FSFN } from 'fs/promises';
                          ...
                      - pattern-inside: |
                          import { $FSFN } from 'node:fs/promises';
                          ...
                  - pattern: $FSFN($P, ...)
                  - metavariable-regex:
                      metavariable: $FSFN
                      regex: ^(readFile|readFileSync|createReadStream|createWriteStream|writeFile|writeFileSync|appendFile|appendFileSync|unlink|unlinkSync|rm|rmSync|rmdir|rmdirSync|readdir|readdirSync|open|openSync|readJson|readJSON|readJsonSync|writeJson|writeJSON|outputFile|outputJson|remove|removeSync|copyFile|copyFileSync|rename|renameSync)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $RES.sendFile($P, ...)
                  - pattern-not: |
                      $RES.sendFile($P, {..., root: $ROOT, ...}, ...)
              - patterns:
                  - pattern: $RES.download($P, ...)
                  - pattern-not: |
                      $RES.download($P, ..., {..., root: $ROOT, ...}, ...)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|response)$
          - focus-metavariable: $P

  # ===========================================================================
  # Server-side request forgery
  # ===========================================================================
  - id: ethos.js.ssrf-from-request
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      HTTP request data controls the URL or host of a server-side HTTP request (fetch, axios, got,
      http.get, undici), so an attacker can make the server call internal services or cloud
      metadata endpoints (SSRF). Keep the scheme and host fixed in code, or parse the URL and check
      its hostname against an allowlist before sending the request.
    metadata:
      cwe: ["CWE-918"]
      owasp: ["A10:2021 - Server-Side Request Forgery (SSRF)"]
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
    mode: taint
    pattern-sources: *request-input-sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: $X.length
      - pattern: encodeURIComponent(...)
      - pattern: "$LIST.includes(...) ? $A : $B"
      - pattern: "$LIST.has(...) ? $A : $B"
      # Template or concatenation whose scheme and host (or a leading "/segment") are fixed in code.
      - patterns:
          - pattern: "`...`"
          - pattern-regex: '`(?:https?://[^/?#"''`$\\{}\s]+[/?#]|/[^/\\`$]|\$\{\s*(?:process\.env\.\w+|import\.meta\.env\.\w+|env\.\w+|this\.\w+|config\.\w+|[A-Z][A-Z0-9_]*)\s*\}[/?#])[^`]*`'
      - patterns:
          - pattern: $LEFT + $RIGHT
          - metavariable-regex:
              metavariable: $LEFT
              regex: '^(?:["''`]https?://[^/?#"''`$\\]+[/?#]|["''`]/[^/\\"''`$]|(?:process\.env\.\w+|import\.meta\.env\.\w+|env\.\w+|this\.\w+|config\.\w+|[A-Z][A-Z0-9_]*)\s*\+\s*["''`][/?#])'
      # `${apiBaseUrl}/path` where apiBaseUrl comes from process.env or a literal
      - pattern-either: *fixed-base-url-sanitizers
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $LIST.includes($X)
              - pattern: $LIST.has($X)
              - pattern: $RE.test($X)
          # Only one by-side-effect sanitizer applies per call: leave url.hostname checks to the next entry.
          - pattern-not: $LIST.includes($OBJ.$PROP)
          - pattern-not: $LIST.has($OBJ.$PROP)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $LIST.includes($X.$URLPART)
              - pattern: $LIST.has($X.$URLPART)
              - pattern: $X.$URLPART === $V
              - pattern: $X.$URLPART !== $V
              - pattern: $X.$URLPART == $V
              - pattern: $X.$URLPART != $V
              # const host = url.hostname; ...checks on host...
              - pattern: $HOSTVAR = $X.$URLPART
          - metavariable-regex:
              metavariable: $URLPART
              regex: ^(hostname|host|origin)$
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: $VALIDATE($X)
          - metavariable-regex:
              metavariable: $VALIDATE
              regex: (?i)^(.+\.)?\w*(allow|valid|safe|trust|permit|whitelist)\w*$
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: globalThis.fetch($URL, ...)
              - patterns:
                  - pattern: $FETCHFN($URL, ...)
                  - metavariable-regex:
                      metavariable: $FETCHFN
                      regex: ^(fetch|axios|got|ky|ofetch|\$fetch|nodeFetch|request|needle)$
              - patterns:
                  - pattern: $CLIENT.$VERB($URL, ...)
                  - metavariable-regex:
                      metavariable: $CLIENT
                      regex: ^(axios|got|ky|superagent|needle|undici|ofetch|nodeFetch)$
                  - metavariable-regex:
                      metavariable: $VERB
                      regex: ^(get|post|put|patch|delete|head|options|request|stream|fetch)$
              - patterns:
                  - pattern-either:
                      - pattern: |
                          $AXIOS({..., url: $URL, ...})
                      - pattern: |
                          $AXIOS.request({..., url: $URL, ...})
                  - metavariable-regex:
                      metavariable: $AXIOS
                      regex: ^(axios|got|ky|ofetch)$
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern-either:
                              - pattern: $HTTP.get($URL, ...)
                              - pattern: $HTTP.request($URL, ...)
                          - pattern-not: $HTTP.$HTTPFN({...}, ...)
                      - pattern: |
                          $HTTP.get({..., host: $URL, ...}, ...)
                      - pattern: |
                          $HTTP.get({..., hostname: $URL, ...}, ...)
                      - pattern: |
                          $HTTP.request({..., host: $URL, ...}, ...)
                      - pattern: |
                          $HTTP.request({..., hostname: $URL, ...}, ...)
                  - metavariable-regex:
                      metavariable: $HTTP
                      regex: ^(http|https)$
          - focus-metavariable: $URL

  # ===========================================================================
  # Open redirect
  # ===========================================================================
  - id: ethos.js.open-redirect-from-request
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A redirect target (res.redirect, Response.redirect, the Location header) comes from the
      request, so attackers can craft links on your domain that forward users to a phishing site.
      Redirect only to relative paths you build yourself or to URLs checked against an allowlist of
      hosts (and reject values starting with "//").
    metadata:
      cwe: ["CWE-601"]
      owasp: ["A01:2021 - Broken Access Control"]
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
    mode: taint
    # Headers and cookies are deliberately not sources here (Host/Referer redirects are noisy).
    pattern-sources: *request-input-sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: encodeURIComponent(...)
      - pattern: "$LIST.includes(...) ? $A : $B"
      - pattern: "$LIST.has(...) ? $A : $B"
      # Template or concatenation whose scheme and host (or a leading "/segment") are fixed in code.
      - patterns:
          - pattern: "`...`"
          - pattern-regex: '`(?:https?://[^/?#"''`$\\{}\s]+[/?#]|/[^/\\`$]|\$\{\s*(?:process\.env\.\w+|import\.meta\.env\.\w+|env\.\w+|this\.\w+|config\.\w+|[A-Z][A-Z0-9_]*)\s*\}[/?#])[^`]*`'
      - patterns:
          - pattern: $LEFT + $RIGHT
          - metavariable-regex:
              metavariable: $LEFT
              regex: '^(?:["''`]https?://[^/?#"''`$\\]+[/?#]|["''`]/[^/\\"''`$]|(?:process\.env\.\w+|import\.meta\.env\.\w+|env\.\w+|this\.\w+|config\.\w+|[A-Z][A-Z0-9_]*)\s*\+\s*["''`][/?#])'
      # `${frontendUrl}/path` where frontendUrl comes from process.env or a literal
      - pattern-either: *fixed-base-url-sanitizers
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $X.startsWith(...)
              - pattern: $LIST.includes($X)
              - pattern: $LIST.has($X)
              - pattern: $RE.test($X)
          # Only one by-side-effect sanitizer applies per call: leave url.hostname checks to the next entry.
          - pattern-not: $LIST.includes($OBJ.$PROP)
          - pattern-not: $LIST.has($OBJ.$PROP)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $LIST.includes($X.$URLPART)
              - pattern: $LIST.has($X.$URLPART)
              - pattern: $X.$URLPART === $V
              - pattern: $X.$URLPART !== $V
              - pattern: $HOSTVAR = $X.$URLPART
          - metavariable-regex:
              metavariable: $URLPART
              regex: ^(hostname|host|origin)$
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: $VALIDATE($X)
          - metavariable-regex:
              metavariable: $VALIDATE
              regex: (?i)^(.+\.)?\w*(allow|valid|safe|trust|permit|whitelist)\w*$
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($URL, ...)
              - pattern: $RES.redirect($STATUS, $URL)
              - pattern: $RES.location($URL)
              - pattern: Response.redirect($URL, ...)
              - pattern: NextResponse.redirect($URL, ...)
              - patterns:
                  - pattern-either:
                      - pattern: $RES.setHeader($HEADER, $URL)
                      - pattern: $RES.set($HEADER, $URL)
                      - pattern: $RES.header($HEADER, $URL)
                      - pattern: $RES.append($HEADER, $URL)
                  - metavariable-regex:
                      metavariable: $HEADER
                      regex: (?i)^["'`]location["'`]$
              - pattern: |
                  $RES.writeHead($CODE, {..., Location: $URL, ...})
              - pattern: |
                  $RES.writeHead($CODE, {..., location: $URL, ...})
              - pattern: |
                  $RES.writeHead($CODE, {..., "Location": $URL, ...})
              - pattern: |
                  new Response($BODY, {..., headers: {..., Location: $URL, ...}, ...})
              - pattern: |
                  new Response($BODY, {..., headers: {..., location: $URL, ...}, ...})
              - pattern: |
                  new Response($BODY, {..., headers: {..., "Location": $URL, ...}, ...})
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import { redirect } from 'next/navigation';
                          ...
                      - pattern-inside: |
                          import { redirect } from '@remix-run/node';
                          ...
                      - pattern-inside: |
                          import { redirect } from '@remix-run/cloudflare';
                          ...
                      - pattern-inside: |
                          import { redirect } from 'react-router';
                          ...
                  - pattern: redirect($URL, ...)
          - focus-metavariable: $URL
