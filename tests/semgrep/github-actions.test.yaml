# Synthetic GitHub Actions workflows used as Semgrep rule fixtures.
name: issue-triage
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
# ok: ethos.yaml.github-actions-permissions-write-all
permissions:
  contents: read
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log the issue title
        # ruleid: ethos.yaml.github-actions-run-script-injection
        run: echo "New issue -> ${{ github.event.issue.title }}"
      - name: Build a summary
        # ruleid: ethos.yaml.github-actions-run-script-injection
        run: |
          echo "Processing issue #${{ github.event.issue.number }}"
          BODY="${{ github.event.issue.body }}"
          echo "$BODY" | head -n 5
      - name: Reply to comment
        # ruleid: ethos.yaml.github-actions-run-script-injection
        run: >
          ./scripts/reply.sh "${{ toJSON(github.event.comment.body) }}"
      - name: Safe use through env
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        # ok: ethos.yaml.github-actions-run-script-injection
        run: |
          echo "New issue: $TITLE"
          printf '%s\n' "$BODY" > body.txt
      - name: Only trusted values
        # ok: ethos.yaml.github-actions-run-script-injection
        run: echo "Issue ${{ github.event.issue.number }} by ${{ github.actor }} in ${{ github.repository }}"
      - name: Boolean expression only
        # ok: ethos.yaml.github-actions-run-script-injection
        run: echo "is bug report = ${{ contains(github.event.issue.title, 'bug') }}"
      - name: Label from script
        uses: actions/github-script@v7
        with:
          # ruleid: ethos.yaml.github-actions-github-script-injection
          script: |
            const title = "${{ github.event.issue.title }}";
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: title.includes('bug') ? ['bug'] : ['triage'],
            });
      - name: Safe script through env
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          # ok: ethos.yaml.github-actions-github-script-injection
          script: |
            const body = process.env.COMMENT_BODY;
            core.info(`comment length: ${body.length}`);
      - name: Safe script reading the payload
        uses: actions/github-script@v7
        with:
          # ok: ethos.yaml.github-actions-github-script-injection
          script: |
            const { title } = context.payload.issue;
            core.setOutput('title-length', title.length);
---
name: pr-checks
on: [pull_request, push]
# ruleid: ethos.yaml.github-actions-permissions-write-all
permissions: write-all
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ok: ethos.yaml.github-actions-pull-request-target-checkout
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Echo branch
        # ruleid: ethos.yaml.github-actions-run-script-injection
        run: git fetch origin ${{ github.head_ref }} && git log -1 --format=%s
      - name: Commit messages
        # ruleid: ethos.yaml.github-actions-run-script-injection
        run: echo "${{ github.event.head_commit.message }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Reference PR title in script
        uses: actions/github-script@v7
        with:
          # ruleid: ethos.yaml.github-actions-github-script-injection
          script: core.notice(`PR ${{ github.event.pull_request.title }} from ${{ github.event.pull_request.head.ref }}`)
      - name: Not github-script
        uses: some-org/custom-action@v1
        with:
          # ok: ethos.yaml.github-actions-github-script-injection
          script: ${{ github.event.pull_request.title }}
  deploy:
    # ruleid: ethos.yaml.github-actions-permissions-write-all
    permissions: "write-all"
    runs-on: ubuntu-latest
    steps:
      - run: npm ci && npm run deploy
---
name: pr-target-preview
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ruleid: ethos.yaml.github-actions-pull-request-target-checkout
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm ci && npm run build
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch only
        uses: actions/checkout@v4
        with:
          # ok: ethos.yaml.github-actions-pull-request-target-checkout
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: 'Thanks for the contribution!',
            });
  same-repo-only:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ok: ethos.yaml.github-actions-pull-request-target-checkout
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm ci && npm test
  approved-by-maintainer:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'safe to test') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ok: ethos.yaml.github-actions-pull-request-target-checkout
          ref: ${{ github.event.pull_request.head.sha }}
  skip-bots:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          # ruleid: ethos.yaml.github-actions-pull-request-target-checkout
          ref: ${{ github.event.pull_request.head.ref }}
      - run: npm ci && npm run lint
---
name: pr-target-label
on: [pull_request_target]
# ok: ethos.yaml.github-actions-permissions-write-all
permissions: read-all
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # ruleid: ethos.yaml.github-actions-pull-request-target-checkout
          ref: ${{ github.head_ref }}
      - run: npm test
      - name: Checkout merge ref
        uses: actions/checkout@v4
        with:
          # ruleid: ethos.yaml.github-actions-pull-request-target-checkout
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Some other action with a ref input
        uses: some-org/fetch-config@v2
        with:
          # ok: ethos.yaml.github-actions-pull-request-target-checkout
          ref: ${{ github.event.pull_request.head.sha }}
---
name: release-notes
on:
  issues:
    types: [opened]
  workflow_run:
    workflows: [ci]
    types: [completed]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Committer of the tested commit
        # ruleid: ethos.yaml.github-actions-run-script-injection
        run: echo "Last commit by ${{ github.event.workflow_run.head_commit.committer.name }}"
      - name: Title of the finished run
        # ruleid: ethos.yaml.github-actions-run-script-injection
        run: echo "Finished run -> ${{ github.event.workflow_run.display_title }}"
      - name: Save the whole issue
        # ruleid: ethos.yaml.github-actions-run-script-injection
        run: echo '${{ toJSON(github.event.issue) }}' > issue.json
      - name: Function names are case-insensitive
        # ok: ethos.yaml.github-actions-run-script-injection
        run: echo "bug report = ${{ Contains(github.event.issue.title, 'bug') }}"
      - name: Conclusion only
        # ok: ethos.yaml.github-actions-run-script-injection
        run: echo "CI finished with ${{ github.event.workflow_run.conclusion }}"
---
name: pr-preview
"on":
  pull_request_target:
    types: [opened, synchronize, labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ruleid: ethos.yaml.github-actions-pull-request-target-checkout
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm ci && npm run build
  checkout-with-cli:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-preview')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the PR with the GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        # ruleid: ethos.yaml.github-actions-pull-request-target-checkout
        run: gh pr checkout ${{ github.event.pull_request.number }}
      - name: Fetch and switch to the PR head
        # ruleid: ethos.yaml.github-actions-pull-request-target-checkout
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head
          git checkout pr-head
          npm install && npm test
      - name: List changed files only
        # ok: ethos.yaml.github-actions-pull-request-target-checkout
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head
          git diff --name-only HEAD FETCH_HEAD > changed-files.txt
  same-repo-step:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only branches of this repository
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          # ok: ethos.yaml.github-actions-pull-request-target-checkout
          ref: ${{ github.event.pull_request.head.sha }}
  maintainer-label:
    if: github.event.action == 'labeled' && github.event.label.name == 'safe to test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ok: ethos.yaml.github-actions-pull-request-target-checkout
          ref: ${{ github.event.pull_request.head.sha }}
  trusted-authors:
    runs-on: ubuntu-latest
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    steps:
      - name: Check out with the GitHub CLI
        # ok: ethos.yaml.github-actions-pull-request-target-checkout
        run: gh pr checkout ${{ github.event.pull_request.number }}
