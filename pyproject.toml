[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ethossecurity"
version = "0.3.0"
description = "Vendor-neutral security orchestration via MCP, skills and scanner adapters"
license = "PolyForm-Noncommercial-1.0.0 OR LicenseRef-EthosSecurity-Evaluation"
license-files = ["LICENSE", "EVALUATION.md", "EVALUATION.en.md", "licenses/*.md"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5", "mcp>=1.12,<2"]

[project.scripts]
ethos-sec = "ethossecurity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ethossecurity = ["schemas/*.json", "rules/*.toml", "rules/semgrep/*.yaml", "assets/*.json", "assets/skills/*/SKILL.md", "assets/adapters/*/*", "assets/ethossecurity.yaml"]
