              def $FN(..., $P: $T = Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $FN(..., $P: $T = Security(...), ...):
                ...
          - pattern-either:
              - patterns:
                  - metavariable-regex:
                      metavariable: $T
                      regex: ^(?:HttpUrl|AnyUrl|AnyHttpUrl|Path|PurePath)$
                  - pattern: $P
              - pattern: $P.$ATTR
    pattern-sanitizers:
      # records loaded from the database by a request id are not request data
      - patterns:
          - pattern-either:
              - pattern: $Q.first(...)
              - pattern: $Q.one(...)
              - pattern: $Q.one_or_none(...)
              - pattern: $Q.scalar(...)
              - pattern: $Q.scalar_one(...)
              - pattern: $Q.scalar_one_or_none(...)
              - pattern: $Q.first_or_404(...)
              - pattern: $Q.get_or_404(...)
              - pattern: $Q.fetchone()
              - pattern: $Q.fetchall()
          # not when the query itself is built here: cur.execute(f"...").fetchall()
          - metavariable-regex:
              metavariable: $Q
              regex: (?s)^(?!.*\b(?:execute|executemany|executescript|exec_driver_sql|raw|extra|text|read_sql|read_sql_query)\s*\()
      - pattern-either:
          - pattern: $MODEL.query.get(...)
          - pattern: $MODEL.objects.get(...)
          - pattern: $MODEL.objects.filter(...)
          - pattern: django.shortcuts.get_object_or_404(...)
      - patterns:
          - pattern: $SESSION.get($MODEL, ...)
          - metavariable-regex:
              metavariable: $MODEL
              regex: ^[A-Z][A-Za-z0-9]*[a-z][A-Za-z0-9]*$
      # conversions that drop path/command/SQL meaning, unless they wrap the sink itself
      - patterns:
          - pattern-either:
              - pattern: int($ARG, ...)
              - pattern: float($ARG, ...)
              - pattern: io.BytesIO($ARG, ...)
              - pattern: io.StringIO($ARG, ...)
          - metavariable-regex:
              metavariable: $ARG
              regex: (?s)^(?!.*\b(?:open|send_file|FileResponse|remove|unlink|rmtree|read_text|read_bytes|write_text|write_bytes|save)\s*\()
      # lookup in a constant allowlist: COMMANDS[action], TEMPLATES.get(name)
      - patterns:
          - pattern-either:
              - pattern: $MAP[...]
              - pattern: $MAP.get(...)
          - metavariable-regex:
              metavariable: $MAP
              regex: ^(?!.*\b(?:request|req)\.)(?:\w+\.)*(?!(?:GET|POST|FILES|COOKIES|META)$)[A-Z][A-Z0-9_]*$
      # membership test against a constant allowlist: if name not in ALLOWED: abort(400)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $V in $ALLOWED
              - pattern: $V not in $ALLOWED
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: (?s)^(?:(?!.*\b(?:request|req)\.)(?:\w+\.)*(?!(?:GET|POST|FILES|COOKIES|META)$)[A-Z][A-Z0-9_]*|[\[({].*)$
          - metavariable-regex:
              metavariable: $V
              regex: ^\w+$
          - focus-metavariable: $V
      - pattern: werkzeug.utils.secure_filename(...)
      - pattern: werkzeug.secure_filename(...)
      - pattern: werkzeug.utils.safe_join(...)
      - pattern: werkzeug.security.safe_join(...)
      - pattern: flask.safe_join(...)
      - pattern: os.path.basename(...)
      - pattern: os.path.splitext(...)[1]
      - pattern: pathlib.Path(...).suffix
      - pattern: pathlib.Path(...).name
      - pattern: pathlib.PurePath(...).name
      - pattern: uuid.UUID(...)
      - pattern: $X.get(..., type=int, ...)
      - pattern: $X.get(..., type=float, ...)
      # containment checks: once the value is tested, treat it as validated
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $V.startswith(...)
              - pattern: $V.is_relative_to(...)
              - pattern: $V.relative_to(...)
              - pattern: os.path.commonpath([..., $V, ...])
              - pattern: '".." in $V'
          - focus-metavariable: $V
      # value checked by a validation helper: if not is_safe_url(url): abort(400)
      - by-side-effect: true
        patterns:
          - pattern: $VALIDATE(..., $V, ...)
          - metavariable-regex:
              metavariable: $VALIDATE
              regex: (?i)^(?:\w+\.)*(?=\w*(?:safe|valid|allowed|trusted|whitelist|allowlist|permitted|within))(?=\w*(?:path|file|name|dir|folder))\w+$
          - metavariable-regex:
              metavariable: $V
              regex: ^\w+$
          - focus-metavariable: $V
      # value checked against an anchored regular expression: re.fullmatch(r"[\w.-]+", host)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: re.fullmatch($RE, $V, ...)
              - patterns:
                  - pattern: re.match($RE, $V, ...)
                  - metavariable-regex:
                      metavariable: $RE
                      regex: (?s)^[rRbB]*["'].*(?:\$|\\Z)["']$
              - pattern: $PAT.fullmatch($V, ...)
              - patterns:
                  - pattern: $PAT.match($V, ...)
                  - metavariable-regex:
                      metavariable: $PAT
                      regex: ^(?:\w+\.)*[A-Z][A-Z0-9_]*$
          - metavariable-regex:
              metavariable: $V
              regex: ^\w+$
          - focus-metavariable: $V
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: io.open($PATH, ...)
              - pattern: codecs.open($PATH, ...)
              - pattern: aiofiles.open($PATH, ...)
              - pattern: flask.send_file($PATH, ...)
              - pattern: starlette.responses.FileResponse($PATH, ...)
              - pattern: fastapi.responses.FileResponse($PATH, ...)
              - pattern: os.remove($PATH, ...)
              - pattern: os.unlink($PATH, ...)
              - pattern: shutil.rmtree($PATH, ...)
              - pattern: $PATH.read_text(...)
              - pattern: $PATH.read_bytes(...)
              - pattern: $PATH.write_text(...)
              - pattern: $PATH.write_bytes(...)
              - pattern: $PATH.unlink(...)
              # pathlib open: (UPLOAD_DIR / name).open("rb"), Path(name).open(), dest_path.open("wb")
              - patterns:
                  - pattern: $PATH.open(...)
                  - metavariable-pattern:
                      metavariable: $PATH
                      pattern-either:
                        - pattern: $BASE / $NAME
                        - pattern: pathlib.Path(...)
              - patterns:
                  - pattern: $PATH.open(...)
                  - metavariable-regex:
                      metavariable: $PATH
                      regex: (?i)^\w*(?:path|dest|destination|target|location)\w*$
