name: EthosSecurity CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . semgrep==1.178.0
      - run: ethos-sec scan . --profile bug-hunter --config examples/ci.yaml --output reports/security.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: reports/security.json
  assisted-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python tests/smoke_assisted.py
