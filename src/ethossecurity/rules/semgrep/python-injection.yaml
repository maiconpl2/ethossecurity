              # Storage.save(name, content) and FieldFile.save(name, content) validate the name
              - patterns:
                  - pattern: $UPLOAD.save($PATH, ...)
                  - pattern-not: $UPLOAD.save($PATH, $CONTENT, ...)
                  - metavariable-regex:
                      metavariable: $UPLOAD
                      regex: (?i)^(?!.*storage)
              - pattern: $UPLOAD.save($PATH, "...", ...)
          - focus-metavariable: $PATH

  # ---------------------------------------------------------------------- SSRF
  - id: ethos.python.ssrf-from-request
    languages: [python]
    severity: ERROR
    message: >-
      The server sends an HTTP request to a URL controlled by HTTP request
      data, which lets a caller reach internal services or cloud metadata
      endpoints (SSRF). Keep the scheme and host fixed in code and only insert
      escaped path or query values, or check the parsed host against an
      allowlist.
    metadata:
      cwe: ["CWE-918"]
      owasp: ["A10:2021 - Server-Side Request Forgery (SSRF)"]
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args
          - pattern: flask.request.form
          - pattern: flask.request.values
          - pattern: flask.request.json
          - pattern: flask.request.files
          - pattern: flask.request.data
          - pattern: flask.request.cookies
          - pattern: flask.request.headers
          - pattern: flask.request.view_args
          - pattern: flask.request.get_json(...)
          - pattern: flask.request.get_data(...)
      # Django / DRF / Starlette request objects
      - patterns:
          - pattern-either:
              - pattern: $R.GET
              - pattern: $R.POST
              - pattern: $R.FILES
              - pattern: $R.COOKIES
              - pattern: $R.query_params
              - pattern: $R.path_params
          - metavariable-regex:
              metavariable: $R
              regex: ^(request|req|self\.request)$
      - patterns:
          - pattern-inside: |
              def $FN(..., request, ...):
                ...
          - pattern-either:
              - pattern: request.data
              - pattern: request.body
      # FastAPI / Starlette `Request` parameter
      - patterns:
          - pattern-inside: |
              def $FN(..., $R: Request, ...):
                ...
          - pattern-either:
              - pattern: $R.json()
              - pattern: $R.form()
              - pattern: $R.body()
              - pattern: $R.headers
              - pattern: $R.cookies
      # FastAPI uploaded file name
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $P: UploadFile, ...):
                    ...
              - pattern-inside: |
                  def $FN(..., $P: UploadFile = $D, ...):
                    ...
          - pattern: $P.filename
      # Flask view arguments with a string/path converter: @app.route("/f/<path:name>")
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE($PATH, ...)
              def $FN(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          - metavariable-regex:
              metavariable: $PATH
              regex: .*<(string:|path:)?\w+>
          - pattern: $P
      # FastAPI path/query parameters declared as str
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: str, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: str = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: Optional[str] = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: str | None = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: Annotated[str, ...], ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: Annotated[str, ...] = $D, ...):
                    ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(get|post|put|patch|delete|api_route|websocket)$
          # values injected by FastAPI dependencies (current user, settings) are not request input
          - pattern-not-inside: |
              def $FN(..., $P: $T = Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $FN(..., $P: $T = Security(...), ...):
                ...
          - pattern-not-inside: |
              def $FN(..., $P: Annotated[$T, Depends(...)], ...):
                ...
          - pattern: $P
      # FastAPI URL/path-typed parameters and request body models: def create(item: ItemIn) -> item.field
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $FN(..., $P: $T, ...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(get|post|put|patch|delete|api_route|websocket)$
          - metavariable-regex:
              metavariable: $T
              regex: ^(?!(?:Request|Response|WebSocket|UploadFile|BackgroundTasks|Session|AsyncSession|HTTPConnection|SecurityScopes)$)[A-Z]\w*$
          - pattern-not-inside: |
              def $FN(..., $P: $T = Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $FN(..., $P: $T = Security(...), ...):
                ...
          - pattern-either:
              - patterns:
                  - metavariable-regex:
                      metavariable: $T
                      regex: ^(?:HttpUrl|AnyUrl|AnyHttpUrl|Path|PurePath)$
                  - pattern: $P
              - pattern: $P.$ATTR
    pattern-sanitizers:
      # records loaded from the database by a request id are not request data
      - patterns:
          - pattern-either:
              - pattern: $Q.first(...)
              - pattern: $Q.one(...)
              - pattern: $Q.one_or_none(...)
              - pattern: $Q.scalar(...)
              - pattern: $Q.scalar_one(...)
              - pattern: $Q.scalar_one_or_none(...)
              - pattern: $Q.first_or_404(...)
              - pattern: $Q.get_or_404(...)
              - pattern: $Q.fetchone()
              - pattern: $Q.fetchall()
          # not when the query itself is built here: cur.execute(f"...").fetchall()
          - metavariable-regex:
              metavariable: $Q
              regex: (?s)^(?!.*\b(?:execute|executemany|executescript|exec_driver_sql|raw|extra|text|read_sql|read_sql_query)\s*\()
      - pattern-either:
          - pattern: $MODEL.query.get(...)
          - pattern: $MODEL.objects.get(...)
          - pattern: $MODEL.objects.filter(...)
          - pattern: django.shortcuts.get_object_or_404(...)
      - patterns:
          - pattern: $SESSION.get($MODEL, ...)
          - metavariable-regex:
              metavariable: $MODEL
              regex: ^[A-Z][A-Za-z0-9]*[a-z][A-Za-z0-9]*$
      # conversions that drop path/command/SQL meaning, unless they wrap the sink itself
      - patterns:
          - pattern-either:
              - pattern: int($ARG, ...)
              - pattern: float($ARG, ...)
          - metavariable-regex:
              metavariable: $ARG
              regex: (?s)^(?!.*\b(?:(?:requests|httpx|aiohttp)\.\w+|urlopen|Request)\s*\()
      # lookup in a constant allowlist: COMMANDS[action], TEMPLATES.get(name)
      - patterns:
          - pattern-either:
              - pattern: $MAP[...]
              - pattern: $MAP.get(...)
          - metavariable-regex:
              metavariable: $MAP
              regex: ^(?!.*\b(?:request|req)\.)(?:\w+\.)*(?!(?:GET|POST|FILES|COOKIES|META)$)[A-Z][A-Z0-9_]*$
      # membership test against a constant allowlist: if name not in ALLOWED: abort(400)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $V in $ALLOWED
              - pattern: $V not in $ALLOWED
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: (?s)^(?:(?!.*\b(?:request|req)\.)(?:\w+\.)*(?!(?:GET|POST|FILES|COOKIES|META)$)[A-Z][A-Z0-9_]*|[\[({].*)$
          - metavariable-regex:
              metavariable: $V
              regex: ^\w+$
          - focus-metavariable: $V
      - pattern: $X.get(..., type=int, ...)
      - pattern: $X.get(..., type=float, ...)
      - pattern: urllib.parse.quote(...)
      - pattern: urllib.parse.quote_plus(...)
      - pattern: urllib.parse.urlencode(...)
      # URL whose scheme and host are fixed in code: only the path or query varies
      - patterns:
          - pattern: $URL
          - pattern-either:
              - pattern: f"..."
              - pattern: '"..." + $Y'
              - pattern: '"..." % $Y'
              - pattern: '"...".format(...)'
          - metavariable-regex:
              metavariable: $URL
              regex: ^[rR]?[fF]?[rR]?["'][a-zA-Z][a-zA-Z0-9+.-]*://[^/"'{}%]+/
      # relative URL whose first character after "/" is literal (client created with base_url): only
      # "//host" or "/\host" can change the host, so f"/users/{name}" is safe but f"/{name}" is not
      - patterns:
          - pattern: $URL
          - pattern-either:
              - pattern: f"..."
              - pattern: '"..." + $Y'
              - pattern: '"..." % $Y'
              - pattern: '"...".format(...)'
          - metavariable-regex:
              metavariable: $URL
              regex: ^[rR]?[fF]?[rR]?["']/[^/\\{}"'%]
      # URL that starts with a constant or configured base (BASE_URL, settings.API_URL, self.base_url)
      - patterns:
          - pattern: $URL
          - pattern-either:
              - pattern: f"..."
              - pattern: $B + $Y
          - metavariable-regex:
              metavariable: $URL
              regex: ^(?:[rR]?[fF][rR]?["']\{)?(?:(?:(?:self|cls|\w*settings|\w*config|conf)\.)*(?:[A-Z][A-Z0-9_]*|\w*(?:base_url|api_url|endpoint)\w*)|os\.(?:getenv|environ)[^}+]*|(?:current_app|app)\.config\[[^\]]+\])(?:\}/|\s*\+)
      # host checked after parsing: urlparse(url).hostname in ALLOWED_HOSTS
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: urllib.parse.urlparse($V, ...)
              - pattern: urllib.parse.urlsplit($V, ...)
              - pattern: django.utils.http.url_has_allowed_host_and_scheme($V, ...)
          - focus-metavariable: $V
      # prefix check that pins scheme and host: url.startswith("https://partner.example.com/");
      # a scheme-only check such as url.startswith(("http://", "https://")) is not a defense
      - by-side-effect: true
        patterns:
          - pattern: $V.startswith($PREFIX, ...)
          - metavariable-regex:
              metavariable: $PREFIX
              regex: (?i)^(?:\(\s*)?(?:[ru]?["'][a-z][a-z0-9+.-]*://[^/"'{}]+/|(?:\w+\.)*(?!\w*(?:scheme|protocol))\w*(?:url|host|prefix|origin|domain)\w*$)
          - metavariable-regex:
              metavariable: $V
              regex: ^\w+$
          - focus-metavariable: $V
      # value checked by a validation helper: if not is_safe_url(url): abort(400)
      - by-side-effect: true
        patterns:
          - pattern: $VALIDATE(..., $V, ...)
          - metavariable-regex:
              metavariable: $VALIDATE
              regex: (?i)^(?:\w+\.)*(?=\w*(?:safe|valid|allowed|trusted|whitelist|allowlist|permitted|within))(?=\w*(?:url|uri|host|domain|link|endpoint|webhook|callback|addr))\w+$
          - metavariable-regex:
              metavariable: $V
              regex: ^\w+$
          - focus-metavariable: $V
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: requests.$METHOD($URL, ...)
                      - pattern: httpx.$METHOD($URL, ...)
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(get|post|put|patch|delete|head|options|stream)$
              - patterns:
                  - pattern-either:
                      - pattern: requests.$METHOD(..., url=$URL, ...)
                      - pattern: httpx.$METHOD(..., url=$URL, ...)
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(get|post|put|patch|delete|head|options|stream|request)$
              - pattern: requests.request($VERB, $URL, ...)
              - pattern: httpx.request($VERB, $URL, ...)
              - pattern: aiohttp.request($VERB, $URL, ...)
              - patterns:
                  - pattern: urllib.request.urlopen($URL, ...)
                  # urlopen(Request(url)) is reported once, on Request()
                  - pattern-not: urllib.request.urlopen(urllib.request.Request(...), ...)
                  - pattern-not-inside: |
                      $URL = urllib.request.Request(...)
                      ...
              - pattern: urllib.request.Request($URL, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          with requests.Session(...) as $C:
                            ...
                      - pattern-inside: |
                          with httpx.Client(...) as $C:
                            ...
                      - pattern-inside: |
                          with httpx.AsyncClient(...) as $C:
                            ...
                      - pattern-inside: |
                          with aiohttp.ClientSession(...) as $C:
                            ...
                      - pattern-inside: |
                          $C = requests.Session(...)
                          ...
                      - pattern-inside: |
                          $C = httpx.Client(...)
                          ...
                      - pattern-inside: |
                          $C = httpx.AsyncClient(...)
                          ...
                      - pattern-inside: |
                          $C = aiohttp.ClientSession(...)
                          ...
                  - pattern-either:
                      - pattern: $C.$METHOD($URL, ...)
                      - pattern: $C.$METHOD(..., url=$URL, ...)
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(get|post|put|patch|delete|head|options|stream)$
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          with requests.Session(...) as $C:
                            ...
                      - pattern-inside: |
                          with httpx.Client(...) as $C:
                            ...
                      - pattern-inside: |
                          with httpx.AsyncClient(...) as $C:
                            ...
                      - pattern-inside: |
                          with aiohttp.ClientSession(...) as $C:
                            ...
                      - pattern-inside: |
                          $C = requests.Session(...)
                          ...
                      - pattern-inside: |
                          $C = httpx.Client(...)
                          ...
                      - pattern-inside: |
                          $C = httpx.AsyncClient(...)
                          ...
                      - pattern-inside: |
                          $C = aiohttp.ClientSession(...)
                          ...
                  - pattern: $C.request($VERB, $URL, ...)
          - focus-metavariable: $URL

  # ----------------------------------------------- Server-side template injection
  - id: ethos.python.template-injection-dynamic
    languages: [python]
    severity: WARNING
    message: >-
      A Jinja2/Mako template source is assembled with an f-string,
      concatenation, % or .format() from a non-constant value; if that value
      contains template syntax it is executed on the server (SSTI). Keep the
      template constant and pass values as render variables, e.g.
      render_template_string(TEMPLATE, name=name).
    metadata:
      cwe: ["CWE-1336"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: f"...{$X}..."
              - pattern: '"..." % $X'
              - pattern: '"...".format(..., $X, ...)'
              - pattern: '"...".format(..., $K=$X, ...)'
              - pattern: '"..." + $X'
              - pattern: '$X + "..."'
              - pattern: $S.replace($OLD, $X)
          - metavariable-regex:
              metavariable: $X
              regex: ^(?!(?:\w+\.)*[A-Z][A-Z0-9_]*$|int\(|float\(|len\(|["']|\d)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: flask.render_template_string($TPL, ...)
              - pattern: jinja2.Template($TPL, ...)
              - pattern: mako.template.Template($TPL, ...)
              # Environment.from_string(); a SandboxedEnvironment is the safe way to render user templates
              - patterns:
                  - pattern: $ENV.from_string($TPL, ...)
                  - metavariable-regex:
                      metavariable: $ENV
                      regex: (?i)(?:env|jinja|template|tpl|engine)
                  - metavariable-regex:
                      metavariable: $ENV
                      regex: (?i)^(?!.*sandbox)
                  - pattern-not-inside: |
                      $ENV = jinja2.sandbox.SandboxedEnvironment(...)
                      ...
                  - pattern-not-inside: |
                      $ENV = jinja2.sandbox.ImmutableSandboxedEnvironment(...)
                      ...
          # request handlers are covered by ethos.python.template-injection-from-request
          - pattern-not-inside: |
              @$APP.route(...)
              def $FN(...):
                ...
          - pattern-not-inside: |
              @$APP.get(...)
              def $FN(...):
                ...
          - pattern-not-inside: |
              @$APP.post(...)
              def $FN(...):
                ...
          - pattern-not-inside: |
              @$APP.put(...)
              def $FN(...):
                ...
          - pattern-not-inside: |
              @$APP.patch(...)
              def $FN(...):
                ...
          - pattern-not-inside: |
              @$APP.delete(...)
              def $FN(...):
                ...
          - pattern-not-inside: |
              @$APP.api_route(...)
              def $FN(...):
                ...
          - pattern-not-inside: |
              def $FN(..., request, ...):
                ...
          - pattern-not-inside: |
              def $FN(..., $REQ: Request, ...):
                ...
          - pattern-not-inside: |
              def $FN(...):
                ...
                <... flask.request ...>
                ...
          - pattern-not-inside: |
              def $FN(...):
                ...
                <... self.request ...>
                ...
          - focus-metavariable: $TPL

  - id: ethos.python.template-injection-from-request
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request becomes part of a Jinja2/Mako template source,
      so a caller can send template syntax such as {{ ... }} that runs code on
      the server (SSTI). Keep the template constant and pass the value as a
      render variable, e.g. render_template_string(TEMPLATE, name=name).
    metadata:
      cwe: ["CWE-1336"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args
          - pattern: flask.request.form
          - pattern: flask.request.values
          - pattern: flask.request.json
          - pattern: flask.request.files
          - pattern: flask.request.data
          - pattern: flask.request.cookies
          - pattern: flask.request.headers
          - pattern: flask.request.view_args
          - pattern: flask.request.get_json(...)
          - pattern: flask.request.get_data(...)
      # Django / DRF / Starlette request objects
      - patterns:
          - pattern-either:
              - pattern: $R.GET
              - pattern: $R.POST
              - pattern: $R.FILES
              - pattern: $R.COOKIES
              - pattern: $R.query_params
              - pattern: $R.path_params
          - metavariable-regex:
              metavariable: $R
              regex: ^(request|req|self\.request)$
      - patterns:
          - pattern-inside: |
              def $FN(..., request, ...):
                ...
          - pattern-either:
              - pattern: request.data
              - pattern: request.body
      # FastAPI / Starlette `Request` parameter
      - patterns:
          - pattern-inside: |
              def $FN(..., $R: Request, ...):
                ...
          - pattern-either:
              - pattern: $R.json()
              - pattern: $R.form()
              - pattern: $R.body()
              - pattern: $R.headers
              - pattern: $R.cookies
      # FastAPI uploaded file name
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $P: UploadFile, ...):
                    ...
              - pattern-inside: |
                  def $FN(..., $P: UploadFile = $D, ...):
                    ...
          - pattern: $P.filename
      # Flask view arguments with a string/path converter: @app.route("/f/<path:name>")
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE($PATH, ...)
              def $FN(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          - metavariable-regex:
              metavariable: $PATH
              regex: .*<(string:|path:)?\w+>
          - pattern: $P
      # FastAPI path/query parameters declared as str
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: str, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: str = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: Optional[str] = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: str | None = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: Annotated[str, ...], ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: Annotated[str, ...] = $D, ...):
                    ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(get|post|put|patch|delete|api_route|websocket)$
          # values injected by FastAPI dependencies (current user, settings) are not request input
          - pattern-not-inside: |
              def $FN(..., $P: $T = Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $FN(..., $P: $T = Security(...), ...):
                ...
          - pattern-not-inside: |
              def $FN(..., $P: Annotated[$T, Depends(...)], ...):
                ...
          - pattern: $P
      # FastAPI URL/path-typed parameters and request body models: def create(item: ItemIn) -> item.field
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $FN(..., $P: $T, ...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(get|post|put|patch|delete|api_route|websocket)$
          - metavariable-regex:
              metavariable: $T
              regex: ^(?!(?:Request|Response|WebSocket|UploadFile|BackgroundTasks|Session|AsyncSession|HTTPConnection|SecurityScopes)$)[A-Z]\w*$
          - pattern-not-inside: |
              def $FN(..., $P: $T = Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $FN(..., $P: $T = Security(...), ...):
                ...
          - pattern-either:
              - patterns:
                  - metavariable-regex:
                      metavariable: $T
                      regex: ^(?:HttpUrl|AnyUrl|AnyHttpUrl|Path|PurePath)$
                  - pattern: $P
              - pattern: $P.$ATTR
    pattern-sanitizers:
      # records loaded from the database by a request id are not request data
      - patterns:
          - pattern-either:
              - pattern: $Q.first(...)
              - pattern: $Q.one(...)
              - pattern: $Q.one_or_none(...)
              - pattern: $Q.scalar(...)
              - pattern: $Q.scalar_one(...)
              - pattern: $Q.scalar_one_or_none(...)
              - pattern: $Q.first_or_404(...)
              - pattern: $Q.get_or_404(...)
              - pattern: $Q.fetchone()
              - pattern: $Q.fetchall()
          # not when the query itself is built here: cur.execute(f"...").fetchall()
          - metavariable-regex:
              metavariable: $Q
              regex: (?s)^(?!.*\b(?:execute|executemany|executescript|exec_driver_sql|raw|extra|text|read_sql|read_sql_query)\s*\()
      - pattern-either:
          - pattern: $MODEL.query.get(...)
          - pattern: $MODEL.objects.get(...)
          - pattern: $MODEL.objects.filter(...)
          - pattern: django.shortcuts.get_object_or_404(...)
      - patterns:
          - pattern: $SESSION.get($MODEL, ...)
          - metavariable-regex:
              metavariable: $MODEL
              regex: ^[A-Z][A-Za-z0-9]*[a-z][A-Za-z0-9]*$
      # lookup in a constant allowlist: COMMANDS[action], TEMPLATES.get(name)
      - patterns:
          - pattern-either:
              - pattern: $MAP[...]
              - pattern: $MAP.get(...)
          - metavariable-regex:
              metavariable: $MAP
              regex: ^(?!.*\b(?:request|req)\.)(?:\w+\.)*(?!(?:GET|POST|FILES|COOKIES|META)$)[A-Z][A-Z0-9_]*$
      # membership test against a constant allowlist: if name not in ALLOWED: abort(400)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $V in $ALLOWED
              - pattern: $V not in $ALLOWED
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: (?s)^(?:(?!.*\b(?:request|req)\.)(?:\w+\.)*(?!(?:GET|POST|FILES|COOKIES|META)$)[A-Z][A-Z0-9_]*|[\[({].*)$
          - metavariable-regex:
              metavariable: $V
              regex: ^\w+$
          - focus-metavariable: $V
      - pattern: int(...)
      - pattern: float(...)
      - pattern: $X.get(..., type=int, ...)
      - pattern: $X.get(..., type=float, ...)
      # value checked by a validation helper: if not is_safe_url(url): abort(400)
      - by-side-effect: true
        patterns:
          - pattern: $VALIDATE(..., $V, ...)
          - metavariable-regex:
              metavariable: $VALIDATE
              regex: (?i)^(?:\w+\.)*(?=\w*(?:safe|valid|allowed|trusted|whitelist|allowlist|permitted|within))(?=\w*(?:template|tpl|input|name))\w+$
          - metavariable-regex:
              metavariable: $V
              regex: ^\w+$
          - focus-metavariable: $V
      # value checked against an anchored regular expression: re.fullmatch(r"[\w.-]+", host)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: re.fullmatch($RE, $V, ...)
              - patterns:
                  - pattern: re.match($RE, $V, ...)
                  - metavariable-regex:
                      metavariable: $RE
                      regex: (?s)^[rRbB]*["'].*(?:\$|\\Z)["']$
              - pattern: $PAT.fullmatch($V, ...)
              - patterns:
                  - pattern: $PAT.match($V, ...)
                  - metavariable-regex:
                      metavariable: $PAT
                      regex: ^(?:\w+\.)*[A-Z][A-Z0-9_]*$
          - metavariable-regex:
              metavariable: $V
              regex: ^\w+$
          - focus-metavariable: $V
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: flask.render_template_string($TPL, ...)
              - pattern: jinja2.Template($TPL, ...)
              - pattern: mako.template.Template($TPL, ...)
              # Environment.from_string(); a SandboxedEnvironment is the safe way to render user templates
              - patterns:
                  - pattern: $ENV.from_string($TPL, ...)
                  - metavariable-regex:
                      metavariable: $ENV
                      regex: (?i)(?:env|jinja|template|tpl|engine)
                  - metavariable-regex:
                      metavariable: $ENV
                      regex: (?i)^(?!.*sandbox)
                  - pattern-not-inside: |
                      $ENV = jinja2.sandbox.SandboxedEnvironment(...)
                      ...
                  - pattern-not-inside: |
                      $ENV = jinja2.sandbox.ImmutableSandboxedEnvironment(...)
                      ...
          - focus-metavariable: $TPL

  # ---------------------------------------------------- XSS: escaping disabled
  - id: ethos.python.markup-unescaped-dynamic
    languages: [python]
    severity: WARNING
    message: >-
      A non-literal value is wrapped in Markup()/mark_safe(), which turns off
      HTML autoescaping, so any user-controlled part becomes cross-site
      scripting. Let the template escape the value, or build the HTML with
      Markup("...").format(...) / format_html() so the inserted values are
      escaped.
    metadata:
      cwe: ["CWE-79"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: markupsafe.Markup($HTML)
                  - pattern: flask.Markup($HTML)
                  - pattern: jinja2.Markup($HTML)
                  - pattern: django.utils.safestring.mark_safe($HTML)
                  - pattern: django.utils.safestring.SafeString($HTML)
              - metavariable-regex:
                  metavariable: $HTML
                  regex: ^(?![rR]?[fF][rR]?["'])(?!(?:\w+\.)*[A-Z][A-Z0-9_]*$)
              - pattern-not: $F("...")
              - pattern-not: $F("..." if $COND else "...")
          - patterns:
              - pattern-either:
                  - pattern: markupsafe.Markup($HTML)
                  - pattern: flask.Markup($HTML)
                  - pattern: jinja2.Markup($HTML)
                  - pattern: django.utils.safestring.mark_safe($HTML)
                  - pattern: django.utils.safestring.SafeString($HTML)
              - metavariable-pattern:
                  metavariable: $HTML
                  patterns:
                    - pattern: f"...{$X}..."
                    - metavariable-regex:
                        metavariable: $X
                        regex: ^(?!(?:\w+\.)*[A-Z][A-Z0-9_]*$|int\(|float\(|len\(|["'])
      # values that were already escaped, sanitized or rendered by a template
      - pattern-not: $F(<... markupsafe.escape(...) ...>)
      - pattern-not: $F(<... html.escape(...) ...>)
      - pattern-not: $F(<... django.utils.html.escape(...) ...>)
      - pattern-not: $F(<... django.utils.html.format_html(...) ...>)
      - pattern-not: $F(<... django.utils.html.format_html_join(...) ...>)
      - pattern-not: $F(<... bleach.clean(...) ...>)
      - pattern-not: $F(<... nh3.clean(...) ...>)
      - pattern-not: $F(<... flask.render_template(...) ...>)
      - pattern-not: $F(<... django.template.loader.render_to_string(...) ...>)

  # --------------------------------------------------- XSS: reflected response
  - id: ethos.python.reflected-xss-from-request
    languages: [python]
    severity: ERROR
    message: >-
      A value from the request URL or a submitted form is written into an HTML
      response without escaping, so a crafted link or form can run JavaScript in
      the visitor's browser (reflected cross-site scripting). Render it with
      render_template (Jinja escapes by default), escape it with
      markupsafe.escape / html.escape, or return JSON (jsonify / JSONResponse).
    metadata:
      cwe: ["CWE-79"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
    mode: taint
    # Like ethos.js.reflected-xss-from-request, only values an attacker can put in a link or a
    # cross-site form are sources: JSON bodies, headers and cookies are not.
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args
          - pattern: flask.request.form
          - pattern: flask.request.values
          - pattern: flask.request.view_args
      # Django / DRF / Starlette request objects
      - patterns:
          - pattern-either:
              - pattern: $R.GET
              - pattern: $R.POST
              - pattern: $R.query_params
              - pattern: $R.path_params
          - metavariable-regex:
              metavariable: $R
              regex: ^(request|req|self\.request)$
      - patterns:
          - pattern-inside: |
              def $FN(..., $R: Request, ...):
                ...
          - pattern-either:
              - pattern: $R.query_params
              - pattern: $R.path_params
      # Flask view arguments with a string/path converter: @app.route("/hello/<name>")
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE($PATH, ...)
              def $FN(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          - metavariable-regex:
              metavariable: $PATH
              regex: .*<(string:|path:)?\w+>
          - pattern: $P
      # FastAPI path/query parameters declared as str
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: str, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: str = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: Optional[str] = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: str | None = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: Annotated[str, ...], ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FN(..., $P: Annotated[str, ...] = $D, ...):
                    ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(get|post|put|patch|delete|api_route)$
          - pattern-not-inside: |
              def $FN(..., $P: $T = Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $FN(..., $P: $T = Security(...), ...):
                ...
          - pattern-not-inside: |
              def $FN(..., $P: Annotated[$T, Depends(...)], ...):
                ...
          - pattern: $P
    pattern-sanitizers:
      # Function and method calls end the flow (escape(), render_template(), jsonify(), redirect(),
      # int(), a database lookup): their result is new data. String helpers keep propagating, and
      # the response constructors stay open so the sinks below can see their arguments.
      - patterns:
          - pattern: $CALLEE(...)
          - metavariable-regex:
              metavariable: $CALLEE
              regex: ^(?!(?:str|format|unquote|unquote_plus|make_response|Response|HTMLResponse|HttpResponse|HttpResponseBadRequest|HttpResponseForbidden|HttpResponseNotFound|HttpResponseServerError)$)\w+$
      - patterns:
          - pattern: $RECV.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?!(?:strip|lstrip|rstrip|lower|upper|title|capitalize|casefold|swapcase|replace|format|format_map|join|get|getlist|encode|decode|removeprefix|removesuffix|ljust|rjust|center|zfill|unquote|unquote_plus|make_response|Response|HTMLResponse|HttpResponse|HttpResponseBadRequest|HttpResponseForbidden|HttpResponseNotFound|HttpResponseServerError)$)\w+$
      # .get()/.getlist() keep the value only on request mappings (request.args.get("q")); on other
      # objects (requests.get(url), cache.get(key)) the result is new data
      - patterns:
          - pattern-either:
              - pattern: $RECV.get(...)
              - pattern: $RECV.getlist(...)
          - metavariable-regex:
              metavariable: $RECV
              regex: ^(?!(?:\w+\.)*(?:args|form|values|view_args|GET|POST|query_params|path_params|params|query|data)$)
      # request.args.get("page", 1, type=int) returns a number
      - pattern: $X.get(..., type=int, ...)
      - pattern: $X.get(..., type=float, ...)
      # dicts and lists returned from a view are serialized as JSON
      - pattern: "{$K: $V, ...}"
      - pattern: "[$X, ...]"
    pattern-sinks:
      # A str returned from a Flask view is served as text/html, and so is one returned from a
      # FastAPI/Starlette route declared with response_class=HTMLResponse.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.route(...)
                  def $FN(...):
                    ...
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $APP = flask.Flask(...)
                          ...
                      - pattern-inside: |
                          $APP = flask.Blueprint(...)
                          ...
                  - pattern-inside: |
                      @$APP.$ROUTE(...)
                      def $FN(...):
                        ...
                  - metavariable-regex:
                      metavariable: $ROUTE
                      regex: ^(get|post|put|patch|delete)$
              - patterns:
                  - pattern-inside: |
                      @$APP.$ROUTE(..., response_class=$RC, ...)
                      def $FN(...):
                        ...
                  - metavariable-regex:
                      metavariable: $RC
                      regex: ^(?:[\w.]+\.)?HTMLResponse$
          - pattern-either:
              - pattern: return $SINK
              - pattern: return $SINK, ...
          # response objects are judged by the sinks below
          - metavariable-regex:
              metavariable: $SINK
              regex: ^(?!(?:[\w.]+\.)?(?:make_response|Response|HTMLResponse|HttpResponse\w*)\()
          - pattern-not:
              patterns:
                - pattern-inside: |
                    $V = $RESP(...)
                    ...
                - pattern-either:
                    - pattern: return $V
                    - pattern: return $V, ...
                - metavariable-regex:
                    metavariable: $RESP
                    regex: ^(?:[\w.]+\.)?(?:make_response|Response|HTMLResponse|HttpResponse\w*)$
          # (body, headers) and (body, status, headers) tuples that set a non-HTML Content-Type
          - pattern-not:
              patterns:
                - pattern-either:
                    - pattern: 'return $X, {..., $HK: $HV, ...}'
                    - pattern: 'return $X, $STATUS, {..., $HK: $HV, ...}'
                - metavariable-regex:
                    metavariable: $HK
                    regex: (?i)^["']content-type["']$
                - metavariable-regex:
                    metavariable: $HV
                    regex: ^["'](?!.*html)
          - focus-metavariable: $SINK
      # Flask/Werkzeug responses default to text/html unless another type is set
      - patterns:
          - pattern-either:
              - pattern: flask.make_response($SINK, ...)
              - pattern: flask.Response($SINK, ...)
              - pattern: flask.Response(..., response=$SINK, ...)
              - pattern: werkzeug.wrappers.Response($SINK, ...)
              - pattern: werkzeug.wrappers.Response(..., response=$SINK, ...)
          - pattern-not: $F(..., mimetype="=~/^(?!.*html)/", ...)
          - pattern-not: $F(..., content_type="=~/^(?!.*html)/", ...)
          - pattern-not:
              patterns:
                - pattern-either:
                    - pattern: '$F(..., {..., $HK: $HV, ...}, ...)'
                    - pattern: '$F(..., headers={..., $HK: $HV, ...}, ...)'
                - metavariable-regex:
                    metavariable: $HK
                    regex: (?i)^["']content-type["']$
                - metavariable-regex:
                    metavariable: $HV
                    regex: ^["'](?!.*html)
          - pattern-not-inside: |
              $RESP = $F(...)
              ...
              $RESP.mimetype = "=~/^(?!.*html)/"
          - pattern-not-inside: |
              $RESP = $F(...)
              ...
              $RESP.content_type = "=~/^(?!.*html)/"
          - pattern-not-inside: |
              $RESP = $F(...)
              ...
              $RESP.headers["=~/(?i)^content-type$/"] = "=~/^(?!.*html)/"
          - focus-metavariable: $SINK
      # FastAPI / Starlette
      - patterns:
          - pattern-either:
              - pattern: fastapi.responses.HTMLResponse($SINK, ...)
              - pattern: fastapi.responses.HTMLResponse(..., content=$SINK, ...)
              - pattern: starlette.responses.HTMLResponse($SINK, ...)
              - pattern: starlette.responses.HTMLResponse(..., content=$SINK, ...)
              - patterns:
                  - pattern-either:
                      - pattern: fastapi.Response($SINK, ...)
                      - pattern: fastapi.Response(..., content=$SINK, ...)
                      - pattern: fastapi.responses.Response($SINK, ...)
                      - pattern: fastapi.responses.Response(..., content=$SINK, ...)
                      - pattern: starlette.responses.Response($SINK, ...)
                      - pattern: starlette.responses.Response(..., content=$SINK, ...)
                  - pattern: $F(..., media_type="=~/html/", ...)
          - focus-metavariable: $SINK
      # Django: HttpResponse is text/html unless another content_type is given
      - patterns:
          - pattern-either:
              - pattern: django.http.HttpResponse($SINK, ...)
              - pattern: django.http.HttpResponse(..., content=$SINK, ...)
              - pattern: django.http.HttpResponseBadRequest($SINK, ...)
              - pattern: django.http.HttpResponseForbidden($SINK, ...)
              - pattern: django.http.HttpResponseNotFound($SINK, ...)
              - pattern: django.http.HttpResponseServerError($SINK, ...)
          - pattern-not: $F(..., content_type="=~/^(?!.*html)/", ...)
          # content_type is also the second positional parameter
          - pattern-not: $F($BODY, "=~/^(?!.*html)/", ...)
          - focus-metavariable: $SINK
