rules:
  # A literal fallback silently becomes the production secret whenever the variable is missing
  # (a common pattern in AI-generated apps); gitleaks rarely flags low-entropy values like "dev-secret".
  - id: ethos.python.secret-env-fallback
    languages: [python]
    severity: WARNING
    message: >-
      A secret read from the environment falls back to a hardcoded value. If the variable is
      missing in production, the app silently runs with a secret that anyone with the code knows
      (forged sessions or tokens). Fail at startup instead, e.g. os.environ["SECRET_KEY"].
    patterns:
      - pattern-either:
          - pattern: os.environ.get($NAME, "$DEFAULT")
          - pattern: os.getenv($NAME, "$DEFAULT")
          - pattern: decouple.config($NAME, default="$DEFAULT", ...)
          - pattern: environ.Env().str($NAME, default="$DEFAULT", ...)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^['"](?![a-z0-9_]*(?:_URL|_URI|_ENDPOINT|_HOST|_EXPIRES?|_EXPIRY|_EXPIRATION|_TTL|_LIFETIME|_MINUTES|_SECONDS|_HOURS|_DAYS|_LENGTH|_ALGORITHM|_ALG|_HEADER|_NAME|_PATH|_FILE|_PREFIX|_TYPE|_ISSUER|_AUDIENCE|_ENABLED)['"])[a-z0-9_]*(?:SECRET|PRIVATE_KEY|SIGNING_KEY|API_KEY|APIKEY|ACCESS_KEY|AUTH_KEY|ENCRYPTION_KEY|TOKEN|PASSWORD|PASSWD)[a-z0-9_]*['"]$
      - metavariable-regex:
          metavariable: $DEFAULT
          regex: ^.+$
    metadata:
      cwe: [CWE-798, CWE-1188]
      owasp: ["A05:2021 - Security Misconfiguration", "A07:2021 - Identification and Authentication Failures"]
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH

  - id: ethos.js.secret-env-fallback
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A secret read from the environment falls back to a hardcoded value. If the variable is
      missing in production, the app silently runs with a secret that anyone with the code knows
      (forged sessions or tokens). Throw at startup when the variable is not set instead.
    patterns:
      - pattern-either:
          - pattern: process.env.$NAME || "$DEFAULT"
          - pattern: process.env.$NAME ?? "$DEFAULT"
          - pattern: env.$NAME || "$DEFAULT"
          - pattern: env.$NAME ?? "$DEFAULT"
          - pattern: import.meta.env.$NAME || "$DEFAULT"
          - pattern: import.meta.env.$NAME ?? "$DEFAULT"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(?![a-z0-9_]*(?:_URL|_URI|_ENDPOINT|_HOST|_EXPIRES?|_EXPIRY|_EXPIRATION|_TTL|_LIFETIME|_MINUTES|_SECONDS|_HOURS|_DAYS|_LENGTH|_ALGORITHM|_ALG|_HEADER|_NAME|_PATH|_FILE|_PREFIX|_TYPE|_ISSUER|_AUDIENCE|_ENABLED)$)[a-z0-9_]*(?:SECRET|PRIVATE_KEY|SIGNING_KEY|API_KEY|APIKEY|ACCESS_KEY|AUTH_KEY|ENCRYPTION_KEY|TOKEN|PASSWORD|PASSWD)[a-z0-9_]*$
      - metavariable-regex:
          metavariable: $DEFAULT
          regex: ^.+$
    metadata:
      cwe: [CWE-798, CWE-1188]
      owasp: ["A05:2021 - Security Misconfiguration", "A07:2021 - Identification and Authentication Failures"]
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
