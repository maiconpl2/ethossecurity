  # ===========================================================================
  # SQL injection
  # ===========================================================================
  - id: ethos.js.sql-injection-from-request
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      HTTP request data is concatenated or interpolated into a SQL string that is executed (query,
      execute, raw, prepare, all/get/run, $queryRawUnsafe), allowing SQL injection. Keep the SQL text
      fixed and pass values as bound parameters (db.query(sql, [id]) with ? or numbered
      placeholders, .prepare(sql).bind(id)) or use a tagged template such as sql`...` /
      prisma.$queryRaw`...`.
    metadata:
      cwe: ["CWE-89"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
    mode: taint
    pattern-sources: *request-sources
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: Number.parseInt(...)
      - pattern: Number.parseFloat(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Boolean(...)
      - pattern: Math.$FN(...)
      - pattern: $X.length
      - pattern: $TAG`...`
      # node-postgres / mysql2 / libsql query objects with bound values
      - pattern: |
          {..., text: $SQLTEXT, ..., values: $VALUES, ...}
      - pattern: |
          {..., sql: $SQLTEXT, ..., values: $VALUES, ...}
      - pattern: |
          {..., sql: $SQLTEXT, ..., args: $VALUES, ...}
      # Placeholder lists: ids.map(() => "?"), ids.map((_, i) => `$${i + 1}`)
      - pattern: $ARR.map(() => $BODY)
      - patterns:
          - pattern-either:
              - pattern: $ARR.map(($ITEM) => $BODY)
              - pattern: $ARR.map(($ITEM, $IDX) => $BODY)
          - pattern-not: $ARR.map(($ITEM, ...) => <... $ITEM ...>)
      # escape helpers, mysql format(), pg-format %L/%I
      - pattern-either: *sql-escape-sanitizers
      # Allowlist checks: ALLOWED.includes(x) ? x : "id", keys.filter((k) => ALLOWED.has(k))
      - pattern: "$LIST.includes(...) ? $A : $B"
      - pattern: "$LIST.has(...) ? $A : $B"
      - pattern: $ARR.filter(($K) => $LIST.includes($K))
      - pattern: $ARR.filter(($K) => $LIST.has($K))
      - by-side-effect: true
        patterns:
          - pattern: $RE.test($X)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $LIST.includes($X)
              - pattern: $LIST.has($X)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either: *sql-sinks
          - focus-metavariable: $Q

  - id: ethos.js.sql-string-from-function-argument
    languages: [javascript, typescript]
    paths: *skip-test-files
    severity: WARNING
    message: >-
      A function argument is concatenated or interpolated into a SQL string that is executed. If a
      caller ever passes user-influenced data this becomes SQL injection; use placeholders with bound
      parameters or a tagged template (sql`...`, prisma.$queryRaw`...`) instead.
    metadata:
      cwe: ["CWE-89"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
    mode: taint
    pattern-sources: *function-argument-sources
    pattern-sanitizers:
